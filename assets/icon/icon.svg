  <!-- screw base -->
  <rect x="452" y="622" width="120" height="118" rx="16" fill="#ECEFF1"/>
  <rect x="452" y="654" width="120" height="14" fill="#1565C0"/>
  <rect x="452" y="686" width="120" height="14" fill="#1565C0"/>
  <rect x="452" y="718" width="120" height="14" fill="#1565C0"/>

  <!-- base tip -->
