<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#1565C0"/>

  <!-- glow rays -->
  <rect x="502" y="140" width="20" height="64" rx="10" fill="#7FB3FF"/>
  <rect x="740" y="384" width="64" height="20" rx="10" fill="#7FB3FF"/>
  <rect x="220" y="384" width="64" height="20" rx="10" fill="#7FB3FF"/>

  <!-- bulb glass -->
  <circle cx="512" cy="430" r="192" fill="#FFD54F"/>

  <!-- filament -->
